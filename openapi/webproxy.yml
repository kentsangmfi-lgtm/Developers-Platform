                      description: Amount
                    contractCode:
                      type: string
                      description: Contract code
                    origRef:
                      type: string
                      description: Original reference number
                    origTranDate:
                      type: string
                      description: Original transaction date
                      format: YYYY-MM-DD.
                      example: '2023-11-01'
                    liqBuySellType:
                      type: boolean
                      description: |
                        Dictionary:
                          * true: Stand for buy
                          * false: Stand for sell
