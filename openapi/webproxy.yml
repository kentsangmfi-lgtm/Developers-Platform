                      type: number
                      description: Open rate
                    liqRef:
                      type: string
                      description: Close reference
                    liqTranDate:
                      type: string
                      description: Liquidated transaction date
                      format: YYYY-MM-DD.
                      example: '2023-11-01'
                    closeRate:
                      type: number
                      description: Closed Rate
                    PL:
                      type: number
                      description: Profit/Loss
                    liqTranDateTime:
                      type: string
                      description: System date
                      format: ISO 8601
                      example: '2024-01-18T16:45:31.537Z'
                    origTranDateTime:
                      type: string
                      description: System date
                      format: ISO 8601
                      example: '2024-01-18T16:50:31.537Z'
                    storage:
                      type: number
                      description: Storage fee per lot
                      example: 10
                    commission:
                      type: number
                      description: commission fee
                      example: 10
                    floatInterest:
                      type: number
                      description: accumulated amount of interest
                      example: 10
                    tpRate:
                      oneOf:
                        - type: number
                        - type: 'null'
                      description: take profit rate
                    slRate:
                      oneOf:
                        - type: number
                        - type: 'null'
                      description: stop loss rate
