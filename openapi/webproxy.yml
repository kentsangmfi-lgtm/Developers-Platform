                    - rateDecPt
                    - contractCode
                    - requestAmount
                    - amount
                    - liqBuySellType
                    - origRef
                    - origTranDate
                    - openRate
                    - liqRef
                    - liqTranDate
                    - closeRate
                    - PL
                    - liqTranDateTime
                    - origTranDateTime
                    - storage
                    - commission
                    - floatInterest
                    - tpRate
                    - slRate
        '400':
          description: Invalid Input
        '401':
          description: Unauthorized
        '429':
          $ref: '#/components/responses/RateLimitedResponse'
