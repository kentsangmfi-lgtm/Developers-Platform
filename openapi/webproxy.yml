  /api/contractSetting/{contractCode}/tradingHour:
    get:
      summary: Contract setting trading hour
      description: Contract setting trading hour
      operationId: getContractSettingTradingHour
      parameters:
        - name: contractCode
          in: path
          description: contract code
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                description: list of contract code
                items:
                  type: object
                  properties:
                    id:
                      type: number
                    weekday:
                      type: integer
                      format: int32
                      description: |
                        Day of the week: * `1` - Sunday * `2` - Monday * `3` - Tuesday * `4` - Wednesday * `5` - Thursday * `6` - Friday * `7` - Saturday
                      enum:
                        - 1
                        - 2
                        - 3
                        - 4
                        - 5
                        - 6
                        - 7
                    startHour:
                      type: integer
                      description: Start hour
                      min: 0
                      max: 23
                    startMinute:
                      type: integer
                      description: Start minute
                      min: 0
                      max: 59
                    endHour:
                      type: integer
                      description: End hour
                      min: 0
                      max: 23
                    endMinute:
                      type: integer
                      description: End minute
                      min: 0
                      max: 59
                  required:
                    - id
                    - weekday
                    - startHour
                    - startMinute
                    - endHour
                    - endMinute
        '404':
          description: Contract code not found
