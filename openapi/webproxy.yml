    LiquidationSummary:
      type: object
      required:
        - liqRef
        - origRef
        - baseCurr
        - origBuyAmount
        - origSellAmount
        - accPL
      properties:
        liqRef:
          type: integer
          description: Liquidation reference number
        origRef:
          type: integer
          description: Original reference number
        baseCurr:
          type: string
          description: Base currency
        origBuyAmount:
          type: number
          format: double
          description: Original buy amount
        origSellAmount:
          type: number
          format: double
          description: Original sell amount
        accPL:
          type: number
          format: double
          description: Accumulated profit/loss
        tranDate:
          type: string
          format: date-time
          description: Deal tranDate
          x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonFormat(pattern = "yyyy-MM-dd''T''HH:mm:ssXXX")'
          example: '2026-04-28T00:00:00+08:00'
    LiquidationTodayResponse:
      type: object
      properties:
        liquidations:
          type: array
          items:
            $ref: '#/components/schemas/LiquidationSummary'
          description: List of liquidations
    LiquidationDetailResponse:
      type: object
      required:
        - contractCode
        - amount
        - commission
        - pnl
        - interest
        - buyOrderNo
        - buyExecutedPrice
        - sellOrderNo
        - sellExecutedPrice
        - buyAsNewOrder
      properties:
        contractCode:
          type: string
          description: Contract code
        amount:
          type: number
          format: double
          description: Liquidation amount
        commission:
          type: number
          format: double
          description: Commission
        pnl:
          type: number
          format: double
          description: Profit/loss
        interest:
          type: number
          format: double
          description: Interest
        buyOrderNo:
          type: string
          description: Buy order reference number
        buyExecutedTime:
          type: string
          format: date-time
          description: Buy order executed time
          x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonFormat(pattern = "yyyy-MM-dd''T''HH:mm:ssXXX")'
          example: '2026-04-28T00:00:00+08:00'
        buyExecutedPrice:
          type: number
          format: double
          description: Buy executed price
        sellOrderNo:
          type: string
          description: Sell order reference number
        sellExecutedTime:
          type: string
          format: date-time
          description: Sell order executed time
          x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonFormat(pattern = "yyyy-MM-dd''T''HH:mm:ssXXX")'
          example: '2026-04-28T00:00:00+08:00'
        sellExecutedPrice:
          type: number
          format: double
          description: Sell executed price
        newPosRemarks:
          type: string
          description: New position remarks
        liqPosRemarks:
          type: string
          description: Liquidation position remarks
        buyAsNewOrder:
          type: boolean
          description: Whether buy is a new order
paths:
  /api/accountInformation:
    get:
      summary: Get Account Information
      operationId: getAccountInformation
      security:
        - trader: []
      tags:
        - Trader
      responses:
        '200':
          description: successfully processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    description: User name
                  address:
                    type: string
                    description: User address
                  AE:
                    type: string
                    description: User AE name
                  displayCurr:
                    type: string
                    description: User account display currency
                  convOp:
                    type: string
                    description: |
                      Dictionary:
                        * D: Stand for divide the convertion rate
                        * other: Stand for mulitiply the convertion rate
                  convRate:
                    type: number
                    description: convertion rate
                  settleCurr:
                    type: string
                    description: User account settlement currency
                required:
                  - name
                  - address
                  - AE
                  - displayCurr
                  - convOp
                  - convRate
                  - settleCurr
        '401':
          description: Unauthorized
        '429':
          $ref: '#/components/responses/RateLimitedResponse'
  /api/contractSetting:
    get:
      summary: Get contract setting
      operationId: getContractSetting
      security:
        - trader: []
      tags:
        - Trader
      responses:
        '200':
          description: successfully processed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/contractSummary'
        '401':
          description: Unauthorized
        '429':
          $ref: '#/components/responses/RateLimitedResponse'
  /api/executedOrder:
    get:
      summary: Get Account Executed Order
      operationId: getExecutedOrder
      security:
        - trader: []
      tags:
        - Trader
      parameters:
        - $ref: '#/components/parameters/beginDate'
        - $ref: '#/components/parameters/endDate'
        - $ref: '#/components/parameters/currency'
      responses:
        '200':
          description: successfully processed
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    ref:
                      type: number
                      description: Reference number
                    type:
                      type: string
                      enum:
                        - market
                        - stop
                        - limit
                      description: |
                        Dictionary:
                          * market: Stand for market deal
                          * stop: Stand for stop order
                          * limit: Stand for limit order
                    tranDate:
                      type: string
                      description: Transaction date
                    contractCode:
                      type: string
                      description: Contract code
                    commission:
                      type: number
                      description: Day range commission
                    buySellType:
                      type: boolean
                      description: |
                        Dictionary:
                          * true: Stand for buy
                          * false: Stand for sell
                    buyAmount:
                      type: number
                      description: Buy amount
                    sellAmount:
                      type: number
                      description: Sell amount
                    rate:
                      type: number
                      description: Rate
                    newLiq:
                      type: string
                      description: New or Liq
                      enum:
                        - New
                        - Liq
                    executionTime:
                      type: string
                      description: Order execution time
                    appID:
                      type: string
                      description: Terminal type or API app ID
                      examples:
                        - Android
                        - iOS
                        - Java
                        - Mac
                        - Windows
                        - WEB
                        - FIX
                        - Nil
                    trigger:
                      type: string
                      description: Order trigger type
                      enum:
                        - ORDER
                        - CUTLOSS
                        - DAYEND
                        - AUTO
                        - SEMI
                        - AE
                        - DEALER
                        - MANUAL
                  required:
                    - ref
                    - type
                    - tranDate
                    - contractCode
                    - commission
                    - buySellType
                    - buyAmount
                    - sellAmount
                    - rate
                    - newLiq
                    - executionTime
                    - appID
                    - trigger
        '400':
          description: Invalid Input
        '401':
          description: Unauthorized
        '429':
          $ref: '#/components/responses/RateLimitedResponse'
  /api/liquidation:
