        editAE:
          type: string
        editDate:
          type: string
          format: date-time
          x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonFormat(pattern = "yyyy-MM-dd''T''HH:mm:ssXXX")'
          example: '2026-04-28T00:00:00+08:00'
        good:
          type: integer
          description: 0 = Friday, 1 = Cancel, 2 = Day End
        goodTill:
          type: string
          format: date-time
          x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonFormat(pattern = "yyyy-MM-dd''T''HH:mm:ssXXX")'
          example: '2026-04-28T00:00:00+08:00'
        limitOrStop:
          type: boolean
          description: true = limit order, false = stop order
        rateDecPt:
          type: integer
        liqMethod:
          type: integer
        ocoRef:
          type: integer
        liqRate:
          type: number
          format: double
        contractSize:
          type: number
          format: double
        trailingStopSize:
          type: integer
        comment:
          type: string
        liqList:
          type: string
        takeProfitPrice:
          type: number
          format: double
        takeProfitGood:
          type: integer
          description: 0 = Friday, 1 = Cancel, 2 = Day End
        takeProfitGoodTill:
          type: string
          format: date-time
          x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonFormat(pattern = "yyyy-MM-dd''T''HH:mm:ssXXX")'
          example: '2026-04-28T00:00:00+08:00'
        stopLossPrice:
          type: number
          format: double
        stopLossGood:
          type: integer
          description: 0 = Friday, 1 = Cancel, 2 = Day End
        stopLossGoodTill:
          type: string
          format: date-time
          x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonFormat(pattern = "yyyy-MM-dd''T''HH:mm:ssXXX")'
          example: '2026-04-28T00:00:00+08:00'
        refRate:
          type: number
          format: double
          description: Reference Rate (Working Order only)
        createSysDate:
          type: string
          description: System Date string (Working Order only)
